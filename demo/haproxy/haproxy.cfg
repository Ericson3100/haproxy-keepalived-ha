#---------------------------------------------------------------------
# HAProxy configuration used by the docker-compose demo.
# Both load-balancer nodes (lb1, lb2) load this exact file; Keepalived
# decides which node currently owns each virtual IP.
#
# Order of evaluation inside an HTTP frontend/backend:
#   frontend ACLs -> frontend http-request -> use_backend ->
#   backend http-request -> backend http-response -> frontend http-response
#---------------------------------------------------------------------

global
    # Containers log to stdout; on bare metal use /dev/log + rsyslog instead.
    log stdout format raw local0 info
    maxconn 10000
    nbthread 2

    # Runtime API (show stat, set server state drain|maint|ready, ...)
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners

    # TLS hardening: TLS 1.2+ only, strong ciphers, no session tickets.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

# Docker's embedded DNS, so backends can be resolved (and re-resolved)
# even when a container is stopped and started again.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold nx         5s
    hold obsolete   5s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout check   3s
    # Health checks every 3s; DOWN after 2 failures, UP after 2 successes.
    default-server inter 3s fall 2 rise 2 resolvers docker init-addr last,libc,none

#---------------------------------------------------------------------
# Stats users (passwords come from the environment, see .env.example)
#---------------------------------------------------------------------
userlist stats_viewers
    user "${STATS_VIEWER_USER}" insecure-password "${STATS_VIEWER_PASSWORD}"

userlist stats_admins
    user "${STATS_ADMIN_USER}" insecure-password "${STATS_ADMIN_PASSWORD}"

#---------------------------------------------------------------------
# HTTP -> HTTPS redirect
#---------------------------------------------------------------------
frontend http_in
    bind :80
    http-request capture req.hdr(Host) len 128
    http-request redirect scheme https code 301 unless { ssl_fc }

#---------------------------------------------------------------------
# HTTPS entry point (TLS termination, host-based routing)
#---------------------------------------------------------------------
frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1
    http-request capture req.hdr(Host) len 128

    # Host header without an optional ":port" suffix
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower

    acl host_app1 var(txn.host) -m str app1.example.com
    acl host_app2 var(txn.host) -m str app2.example.com
    acl host_api  var(txn.host) -m str api.example.com

    # Custom maintenance page when every server of a backend is DOWN
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_app1 { nbsrv(app1_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_app2 { nbsrv(app2_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_api  { nbsrv(api_backend)  eq 0 }

    use_backend app1_backend if host_app1
    use_backend app2_backend if host_app2
    use_backend api_backend  if host_api
    # Unknown host -> custom 404 page
    default_backend not_found_backend

    # Security headers, only set when the backend did not set its own value.
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains" if !{ res.hdr(Strict-Transport-Security) -m found }
    http-response set-header Content-Security-Policy "frame-ancestors 'none'; default-src 'self'; img-src 'self' data:" if !{ res.hdr(Content-Security-Policy) -m found }
    http-response set-header X-Frame-Options "DENY" if !{ res.hdr(X-Frame-Options) -m found }
    http-response set-header X-Content-Type-Options "nosniff" if !{ res.hdr(X-Content-Type-Options) -m found }
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin" if !{ res.hdr(Referrer-Policy) -m found }
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" if !{ res.hdr(Permissions-Policy) -m found }
    http-response set-header Cross-Origin-Opener-Policy "same-origin" if !{ res.hdr(Cross-Origin-Opener-Policy) -m found }
    # Hide upstream Server headers (reduces fingerprinting)
    http-response del-header Server
    http-response del-header X-Powered-By
    # Which LB node answered (handy while testing failover)
    http-response set-header X-LB-Node "${LB_NODE_NAME}"

#---------------------------------------------------------------------
# Stats page (read-only for viewers, drain/maint/ready for admins)
#---------------------------------------------------------------------
frontend stats
    bind :8404
    mode http
    option dontlog-normal
    stats enable
    stats uri /stats
    stats refresh 5s
    stats realm HAProxy\ Stats
    stats show-legends
    http-request redirect location /stats if { path / }
    http-request auth realm HAProxy unless { http_auth(stats_viewers) } || { http_auth(stats_admins) }
    stats admin if { http_auth(stats_admins) }

#---------------------------------------------------------------------
# Prometheus exporter (scrape http://<node>:8405/metrics)
#---------------------------------------------------------------------
frontend prometheus
    bind :8405
    mode http
    option dontlog-normal
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
# Plain round-robin web app with a layer-7 health check
backend app1_backend
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host app1.example.com
    http-check expect status 200
    server app1-a app1-a:80 check
    server app1-b app1-b:80 check

# Single-server app: stop the container to see the custom 503 page
backend app2_backend
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host app2.example.com
    http-check expect status 200
    server app2-a app2-a:80 check

# API with least-connections balancing and a multi-origin CORS allowlist
backend api_backend
    balance leastconn
    option forwardfor
    option http-server-close
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-var(txn.origin) req.hdr(Origin)
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host api.example.com
    http-check expect status 200
    server api-1 api-1:80 check
    server api-2 api-2:80 check
    http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.origin) -m str -i https://app1.example.com }
    http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.origin) -m str -i https://app2.example.com }
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS" if !{ res.hdr(Access-Control-Allow-Methods) -m found }
    http-response set-header Vary "Origin"

backend not_found_backend
    no log
    http-request return status 404 content-type "text/html" lf-file /etc/haproxy/errors/404.html
