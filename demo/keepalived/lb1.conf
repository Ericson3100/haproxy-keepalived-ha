# Keepalived for demo node lb1 (10.77.0.11)
# Active/active layout: lb1 is MASTER for VIP 10.77.0.100 (VI_1)
#                       and BACKUP for VIP 10.77.0.101 (VI_2).
global_defs {
    router_id lb1
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2
    fall 2
    rise 2
    weight -100
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    # Unicast VRRP works on networks that drop multicast (clouds, some bridges)
    unicast_src_ip 10.77.0.11
    unicast_peer {
        10.77.0.12
    }
    authentication {
        auth_type PASS
        auth_pass demo1234
    }
    virtual_ipaddress {
        10.77.0.100/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance VI_2 {
    state BACKUP
    interface eth0
    virtual_router_id 52
    priority 100
    advert_int 1
    unicast_src_ip 10.77.0.11
    unicast_peer {
        10.77.0.12
    }
    authentication {
        auth_type PASS
        auth_pass demo1234
    }
    virtual_ipaddress {
        10.77.0.101/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
