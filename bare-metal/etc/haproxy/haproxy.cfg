#=====================================================================
# HAProxy - production template (bare metal / VM, two-node HA cluster)
#
# Install as /etc/haproxy/haproxy.cfg on BOTH nodes (the file is identical
# on both; Keepalived decides which node owns each virtual IP).
#
# Replace every <PLACEHOLDER> and the example addresses/domains:
#   192.0.2.100        VIP for internal applications   (Keepalived VI_1)
#   192.0.2.101        VIP for public applications     (Keepalived VI_2)
#   198.51.100.0/24    application servers
#   10.0.100.0/24      administrators' network (stats / cockpit allowlist)
#   example.com        your domain
#
# Validate before (re)loading:  haproxy -c -f /etc/haproxy/haproxy.cfg
#
# Order of evaluation:
#   frontend ACLs -> frontend http-request -> use_backend ->
#   backend http-request -> backend http-response -> frontend http-response
# Header rewrites therefore happen in that order: a backend can set a header
# and the frontend "if !{ res.hdr(X) -m found }" guards will not override it.
#=====================================================================

global
    # local0 = traffic logs, local1 = notices/alerts (see rsyslog.d/haproxy.conf)
    log /dev/log local0
    log /dev/log local1 notice
    # Hard cap on concurrent connections (protects the node from floods)
    maxconn 50000
    user haproxy
    group haproxy
    daemon

    # One process, N threads pinned to N CPUs. Adjust to your vCPU count.
    nbthread 4
    cpu-map auto:1/1-4 0-3

    # TLS: TLS 1.2+ only, strong ciphers, no session tickets.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    # RHEL-family only: follow the system crypto-policy for upstream TLS
    # ssl-default-server-ciphers PROFILE=SYSTEM
    # Only needed if you enable DHE ciphers: openssl dhparam -out /etc/haproxy/dhparams.pem 4096
    # ssl-dh-param-file /etc/haproxy/dhparams.pem

    # Runtime API over a UNIX socket (no HTTP exposure):
    #   echo "show stat" | socat stdio /var/lib/haproxy/stats
    #   echo "set server app1_backend/app1-01 state drain" | socat stdio /var/lib/haproxy/stats
    # mode 660 + level admin = only root/haproxy group can run admin commands.
    # expose-fd listeners = seamless reloads without dropping listening sockets.
    stats socket /var/lib/haproxy/stats mode 660 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    # Do not log connections that carried no data (probes, port scans)
    option  dontlognull
    timeout connect 10s
    timeout client  30s
    timeout server  30s
    timeout check   5s
    # Check every 5s, DOWN after 3 failures, UP again after 2 successes
    default-server inter 5s rise 2 fall 3

#---------------------------------------------------------------------
# Stats users - use hashed passwords in production:
#   user admin password <SHA512_CRYPT_HASH>      (mkpasswd -m sha-512)
#---------------------------------------------------------------------
userlist stats_viewers
    user viewer password <SHA512_CRYPT_HASH_VIEWER>

userlist stats_admins
    user admin password <SHA512_CRYPT_HASH_ADMIN>

#=====================================================================
# FRONTENDS
#=====================================================================
# HTTP -> HTTPS permanent redirect
frontend http_in
    mode http
    bind *:80
    http-request capture req.hdr(Host) len 128
    http-request redirect scheme https code 301 if !{ ssl_fc }

# HTTPS termination on every VIP.
# "transparent" lets HAProxy bind to a VIP that is currently owned by the
# OTHER node (also set net.ipv4.ip_nonlocal_bind=1, see sysctl.d/).
# For several certificates, repeat "crt" (SNI picks the right one) or point
# "crt" at a directory: crt /etc/haproxy/certs/
frontend https_in
    bind 192.0.2.100:443 transparent ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    bind 192.0.2.101:443 transparent ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    http-request deny if !{ ssl_fc }
    http-request capture req.hdr(Host) len 128

    # ---------------------------------------------------------------
    # ACLs: one per published hostname
    #   acl <acl_name> hdr(host) -i <hostname>
    # ---------------------------------------------------------------
    acl host_app1       hdr(host) -i app1.example.com
    acl host_app2       hdr(host) -i app2.example.com
    acl host_api        hdr(host) -i api.example.com
    acl host_ingress    hdr(host) -i dashboard.example.com grafana.example.com
    # Internal services of the load balancer itself
    acl host_lb_stats   hdr(host) -i lb-stats.example.com
    acl host_lb_metrics hdr(host) -i lb-metrics.example.com
    acl host_lb_cockpit hdr(host) -i lb-cockpit.example.com

    # ---------------------------------------------------------------
    # Redirects
    #   http-request redirect location https://<host>/<path> if <acl> { path / }
    # ---------------------------------------------------------------
    http-request redirect location https://lb-stats.example.com/stats if host_lb_stats { path / }

    # ---------------------------------------------------------------
    # Custom 503 when ALL servers of a backend are DOWN
    # ---------------------------------------------------------------
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_app1 { nbsrv(app1_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_app2 { nbsrv(app2_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_api { nbsrv(api_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_ingress { nbsrv(ingress_backend) eq 0 }
    http-request return status 503 content-type "text/html" lf-file /etc/haproxy/errors/503.html if host_lb_cockpit { nbsrv(lb_cockpit_backend) eq 0 }

    # ---------------------------------------------------------------
    # Routing
    # ---------------------------------------------------------------
    use_backend app1_backend        if host_app1
    use_backend app2_backend        if host_app2
    use_backend api_backend         if host_api
    use_backend ingress_backend     if host_ingress
    use_backend lb_stats_backend    if host_lb_stats
    use_backend lb_metrics_backend  if host_lb_metrics
    use_backend lb_cockpit_backend  if host_lb_cockpit
    default_backend not_found_backend

    # ---------------------------------------------------------------
    # Global security headers. Each one is only added if the backend did
    # not already set it, so backends can relax/override per application.
    # ---------------------------------------------------------------
    http-response set-header Content-Security-Policy "frame-ancestors 'none'; default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';" if !{ res.hdr(Content-Security-Policy) -m found }
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" if !{ res.hdr(Strict-Transport-Security) -m found }
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin" if !{ res.hdr(Referrer-Policy) -m found }
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" if !{ res.hdr(Permissions-Policy) -m found }
    http-response set-header X-Frame-Options "DENY" if !{ res.hdr(X-Frame-Options) -m found }
    http-response set-header X-Content-Type-Options "nosniff" if !{ res.hdr(X-Content-Type-Options) -m found }
    http-response set-header X-Permitted-Cross-Domain-Policies "none" if !{ res.hdr(X-Permitted-Cross-Domain-Policies) -m found }
    http-response set-header Cross-Origin-Resource-Policy "same-origin" if !{ res.hdr(Cross-Origin-Resource-Policy) -m found }
    http-response set-header Cross-Origin-Opener-Policy "same-origin" if !{ res.hdr(Cross-Origin-Opener-Policy) -m found }
    http-response set-header Cache-Control "no-store" if !{ res.hdr(Cache-Control) -m found }
    # Hide upstream fingerprints
    http-response del-header Server
    http-response del-header X-Powered-By
    # Access-Control-Allow-Origin must be set PER BACKEND (browsers accept a
    # single origin per response) - see api_backend below.

#---------------------------------------------------------------------
# Layer-4 TLS passthrough routed by SNI (e.g. Kubernetes API servers).
# TLS is NOT terminated, so client-certificate (mTLS) auth keeps working.
#---------------------------------------------------------------------
frontend tcp_sni_passthrough
    mode tcp
    option tcplog
    bind 192.0.2.100:6443 transparent
    timeout client 1m
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl sni_k8s_api req_ssl_sni -i k8s-api.example.com
    use_backend k8s_api_backend if sni_k8s_api
    default_backend reject_tcp_backend

#=====================================================================
# BACKENDS
#=====================================================================
# Balancing algorithms (balance <algo>):
#   roundrobin   - one request per server in turn; good default
#   leastconn    - server with fewest active connections; long-lived requests
#   source       - hash of client IP (poor man's stickiness)
#   uri          - hash of the URI (cache affinity)
#   hdr(<name>)  - hash of a header
#   random       - random server
# With hash-based algorithms add "hash-type consistent" so that adding or
# removing a server remaps as few clients as possible.
#
# Template - copy, rename and adapt:
#
# backend <name>_backend
#     mode http
#     balance roundrobin
#     option forwardfor                                   # adds X-Forwarded-For
#     http-request set-header X-Forwarded-Proto https if { ssl_fc }
#     # option http-server-close                          # 1 request per server connection; NOT for session-heavy apps
#     # cookie SERVERID insert indirect nocache           # sticky sessions
#     # timeout server 1m                                 # slow endpoints
#     # Layer-4 check:   option tcp-check
#     # Layer-7 check:
#     option httpchk
#     http-check send meth GET uri /health ver HTTP/1.1 hdr Host <hostname>
#     http-check expect status 200
#     # Re-encrypt to an HTTPS upstream (add "verify required ca-file ..." in production):
#     # server <srv> <ip>:443 ssl verify none sni str(<hostname>) check
#     server <srv1> <ip1>:<port> check
#     server <srv2> <ip2>:<port> check

# Web application with sticky sessions (stateful app servers)
backend app1_backend
    mode http
    balance leastconn
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    cookie SERVERID insert indirect nocache
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host app1.example.com
    http-check expect status 200
    server app1-01 198.51.100.11:8080 check cookie app1-01
    server app1-02 198.51.100.12:8080 check cookie app1-02

# HTTPS upstream (e.g. IIS hosting several sites): re-encrypt with SNI
backend app2_backend
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host app2.example.com
    http-check expect status 200
    server app2-01 198.51.100.21:443 ssl verify none sni str(app2.example.com) check
    server app2-02 198.51.100.22:443 ssl verify none sni str(app2.example.com) check
    # Relaxed CSP for an app that needs inline scripts
    http-response set-header Content-Security-Policy "frame-ancestors 'self'; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"

# API with a multi-origin CORS allowlist
backend api_backend
    mode http
    balance roundrobin
    option forwardfor
    option http-server-close
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    # 1) remember the request Origin   2) echo it back only if allowed
    http-request set-var(txn.origin) req.hdr(Origin)
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host api.example.com
    http-check expect status 200
    server api-01 198.51.100.31:8080 check
    server api-02 198.51.100.32:8080 check
    http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.origin) -m str -i https://app1.example.com }
    http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.origin) -m str -i https://app2.example.com }
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS" if !{ res.hdr(Access-Control-Allow-Methods) -m found }
    http-response set-header Access-Control-Allow-Headers "Content-Type, Authorization" if !{ res.hdr(Access-Control-Allow-Headers) -m found }
    http-response set-header Vary "Origin"

# Kubernetes ingress controller (NodePort) serving several hostnames
backend ingress_backend
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option tcp-check
    tcp-check connect port 30443 ssl
    server k8s-node-01 198.51.100.41:30443 ssl verify none check
    server k8s-node-02 198.51.100.42:30443 ssl verify none check

# Kubernetes API servers (TCP passthrough)
backend k8s_api_backend
    mode tcp
    balance roundrobin
    timeout server 1m
    option tcp-check
    tcp-check connect port 6443
    server k8s-cp-01 198.51.100.51:6443 check
    server k8s-cp-02 198.51.100.52:6443 check
    server k8s-cp-03 198.51.100.53:6443 check

#---------------------------------------------------------------------
# Load-balancer internal services (admin network only)
#---------------------------------------------------------------------
backend lb_stats_backend
    mode http
    acl admin_net src 10.0.100.0/24 127.0.0.1
    http-request deny unless admin_net
    stats enable
    stats uri /stats
    stats refresh 10s
    stats realm HAProxy\ Stats
    option http-server-close
    # Viewers can look, admins can also drain/maint/ready servers
    http-request auth unless { http_auth(stats_viewers) } || { http_auth(stats_admins) }
    stats admin if { http_auth(stats_admins) }

backend lb_metrics_backend
    mode http
    acl admin_net src 10.0.100.0/24 127.0.0.1
    http-request deny unless admin_net
    http-request use-service prometheus-exporter if { path /metrics }

# Cockpit web console running on the local node
backend lb_cockpit_backend
    mode http
    acl admin_net src 10.0.100.0/24 127.0.0.1
    http-request deny unless admin_net
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host lb-cockpit.example.com
    http-check expect status 200
    server cockpit 127.0.0.1:9090 ssl verify none check

#---------------------------------------------------------------------
# Defaults for unmatched traffic
#---------------------------------------------------------------------
backend not_found_backend
    mode http
    no log
    http-request return status 404 content-type "text/html" lf-file /etc/haproxy/errors/404.html

backend reject_tcp_backend
    mode tcp
    no log
    tcp-request content reject
