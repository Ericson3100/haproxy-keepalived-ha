# Route HAProxy traffic logs (facility local0) into one file per requested host:
#   /var/log/haproxy/hosts/<first-dns-label>/<host>.log
# e.g. app1.example.com -> /var/log/haproxy/hosts/app1/app1.example.com.log
# Requires "http-request capture req.hdr(Host)" in the frontends, which makes
# HAProxy print the host between braces: {app1.example.com}
$CreateDirs on

template(
  name="haproxy_host_log"
  type="string"
  string="/var/log/haproxy/hosts/%$!group%/%$!host%.log"
)

if ($programname == "haproxy" and $syslogfacility-text == "local0") then {
  # 1) Host captured between braces {HOST}
  set $!host = re_extract($msg, "\\{([^}|]+)", 0, 1, "");

  # 2) Fallback: absolute URI "GET https://HOST/..."
  if ($!host == "") then
    set $!host = re_extract($msg, "\"[A-Z]+ https?://([^/ ]+)", 0, 1, "");

  # 3) Strip ":port"
  if ($!host != "") then
    set $!host = re_extract($!host, "^([^:]+)", 0, 1, $!host);

  # 4) Unknown host
  if ($!host == "" or $!host == "-") then
    set $!host = "unknown";

  # 5) Group = first DNS label (app1.example.com -> app1)
  set $!group = re_extract($!host, "^([^.]+)", 0, 1, "other");

  action(
    type="omfile"
    dynaFile="haproxy_host_log"
    createDirs="on"
  )
  stop
}

# local1 (notices/alerts) -> dedicated file
if ($programname == "haproxy" and $syslogfacility-text == "local1") then {
  action(type="omfile" file="/var/log/haproxy/haproxy-events.log")
  stop
}
