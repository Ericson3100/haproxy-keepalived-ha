#=====================================================================
# Keepalived - NODE 2  (install as /etc/keepalived/keepalived.conf)
#
#   VI_1 (VIP 192.0.2.100, internal apps)  -> NODE 2 BACKUP (priority 100)
#   VI_2 (VIP 192.0.2.101, public apps)    -> NODE 2 MASTER (priority 150)
#
# virtual_router_id and auth_pass MUST match node 1 for each instance.
#=====================================================================

global_defs {
    router_id lb-node2
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    fall 2
    rise 2
    weight -100
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    # unicast_src_ip 192.0.2.12
    # unicast_peer {
    #     192.0.2.11
    # }
    authentication {
        auth_type PASS
        auth_pass <VRRP_PASSWORD>
    }
    virtual_ipaddress {
        192.0.2.100/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance VI_2 {
    state MASTER
    interface eth0
    virtual_router_id 52
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <VRRP_PASSWORD>
    }
    virtual_ipaddress {
        192.0.2.101/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
