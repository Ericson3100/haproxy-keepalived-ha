#=====================================================================
# Keepalived - NODE 1  (install as /etc/keepalived/keepalived.conf)
#
# Active/active: each node is MASTER of one VRRP instance and BACKUP of the
# other, so both nodes carry traffic and either can take over everything.
#   VI_1 (VIP 192.0.2.100, internal apps)  -> NODE 1 MASTER (priority 150)
#   VI_2 (VIP 192.0.2.101, public apps)    -> NODE 2 MASTER (priority 150)
#
# Replace: interface name, node IPs (192.0.2.11 / 192.0.2.12), VIPs and
# <VRRP_PASSWORD>. Validate with: keepalived -t -f /etc/keepalived/keepalived.conf
#=====================================================================

global_defs {
    router_id lb-node1
    enable_script_security
    script_user root
}

# Track script must be defined before the instances that reference it.
# On failure, priority drops by 100 (150 -> 50) which is lower than the
# peer's 100, so the peer becomes MASTER for this VIP.
vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    fall 2
    rise 2
    weight -100
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    # Optional: use unicast if multicast VRRP is filtered on your network
    # unicast_src_ip 192.0.2.11
    # unicast_peer {
    #     192.0.2.12
    # }
    authentication {
        auth_type PASS
        # Max 8 characters; only protects against misconfiguration, not attackers.
        auth_pass <VRRP_PASSWORD>
    }
    virtual_ipaddress {
        192.0.2.100/24 dev eth0
        # A VIP in another VLAN needs a second interface, e.g. "dev eth1"
    }
    track_script {
        chk_haproxy
    }
}

vrrp_instance VI_2 {
    state BACKUP
    interface eth0
    virtual_router_id 52
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <VRRP_PASSWORD>
    }
    virtual_ipaddress {
        192.0.2.101/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
